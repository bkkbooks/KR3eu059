body:
  text: 凡例此書本欲使瞽者就針術之學故要字句簡略若文字深艱學者恐難以記憶也蓋所以誘導瞽者學於針科者也天降生民精神各有等差焉容貌亦有好醜焉人之愚者因教而為有知識然天賦之畸形雖神醫亦不能奈之何就中如瞽者則為不幸極端誠可憫憐者也惟尚有辨明遠近之區別及萬物之外貌者喑啞聾跛之類是也獨瞽者反之不能判斷色澤紋理不能諦認道途遠近故授業於彼亦舍針術而他無好機焉因而所以施余之婆心於彼輩亦不過之古來指示刺針之訣所謂俞穴然此書現今因所行於世解剖者而定其針局故盡改俞穴稱局名書中偶有插入洋語蓋洋語者所用泰西醫學之原語襲用之也一書中所以不採針局之名稱於漢法者方今當萬國交通之際殆如不適時態故悉除之但限緊要之個所則記漢名又代漢名由解剖而定名稱如謂施針頭於何筋之起始何仙蔑篤兒然豫固不敏學亦陋淺有何為焉故待後之訂正者也第一章定形森羅萬象固是無形自然成焉唯為其形也有圓有扁有角有長短或有大小厚薄故定形之法宜從尺度然尺度亦各國其制不同獨用佛國之蔑篤兒尺則謂無大等差矣蓋一蔑篤兒者概當我三尺強矣但尺者寸十倍之稱然謂寸謂尺亦其根據創於大極大極者謂斥象無形之點譬以針頭沖物體則如第一圖更謂如呈一個之點者也又一點之傍加一點倍增加而橫連列之點則為一文字之形名曰地平線恰如橫針之象如第二圖又從地平線之中心向上下而畫線者名曰鉛直線如直立針既縱橫二線相合則為十字形又加十字形之間漸次追間隙以作十字形又施點於各線末端之間點連作環然後假除去十字形則如第三圖唯殘一輪名曰圓譬猶針干之橫斷面蓋圓輪之內畫十字形且從十字形之中心一方之橫線與縱線相對則所謂為九十度之角譬猶人身直立橫開上肢則如第四圖顯腋下角度是也故圓輪之角度成於三百六十而一個之其角悉鋭譬第五圖如烏嘴反九十度之角鈍矣又半割圓輪者名曰孤線譬擬眼窩緣如第六圖又象九十度自橫線之極端縱線與並行而更覆割孤線畫鉛直線且當二個縱線之末端引橫線則所謂為角第七圖是也譬欲象用四個之針則先置一個針於縱線又一個針者以針長之距離令並行而殘針二個者橫並行縱針之上下則所謂為角又從角之一隅對他隅而更引斜線則得二個三角形三角形者人身直立而開足於左右則顯股間如第八圖是也第二章古今針之種類古有制九針法如第九圖第十圖第十一圖是也內經曰虛實之要九針最妙者為其各有所宜也注曰熱在頭身宜鑱針分肉氣滿宜圓針脈氣虛少宜匙針瀉熱出血發泄痼病宜鋒針破癰腫出膿血宜鈹針調陰陽去暴痹宜圓利針治經絡中痛痹宜毫針痹深居骨解腰脊節腠之間者宜長針虛風舍於骨解皮膚之間者宜大針此之謂各有所宜也以下略然而所用治療之針者近世雖有如第十二圖柳葉針或如第十三圖三稜針等若千種類各是所用瀉血法之針而所謂屬外科的器具也是以適針術者無勝毫針又針者以金屬製之蓋金屬之通性除水銀他金屬在常溫則悉屬固形體又存一種礦輝又其色各礦色不同有淡白有青色有灰白色但在黃金及銅則具固有之色又金屬者各雖不透明獨如黃金者槌為箔則通光線又金屬者溫且電氣之好導體也故銀自銅易導銅自黃金易導矣又遇適應之溫則雖得熔融多是得結晶者也又金屬者堅軟各異之又所以有用工業無他易展延由難摧折又輕金屬大氣之酸素與親和力甚強氣中速酸化雖失光澤又金屬親和力弱故永遠可得保光澤又金屬與水素無化合之性又白金及黃金投沸騰硫酸亦敢不熔解銀及他金屬能可熔解硝酸又如銀及黃金者其分子凝聚至緻密故制之宜作毫針第三章銀針及金針之性質第一款銀所在有純銀又為硫化銀礦又硫黃及砒素或有使安質母尼化合總他金屬混化合物現出矣偶其小量混硫化鉛製法不混合他金屬則製法亦簡易其遊離者於爐中熔融而除去不潔物如硫化銀礦者於爐中加高度之熱而熔融則全得銀性狀銀者白色金屬而能無變化氣中其比重一五也煅至千度則為熔融又遇爆鳴瓦斯火焰熱則蒸餾又使易溫熱及電氣導又捶則為箔片又牽延則為細微線又銀者不論熱高低均無酸素與化合雖然熱之熔融之際能使自溶二十倍酸素攝收將冷卻還固形當此期復放離之其放離際發特異之音謂名之銀沸迸銀者含有硫化水素故觸大氣則被黑色鏽衣是由化生其硫化銀又有格魯兒貌魯繆母及沃度與親和力甚盛而直與之化合性又遇鹽酸亦不論溫度之高低渾雖無侵遇濃厚熱硫酸溶液則使硫酸銀化成且溶解於其中又常溫於硝酸能使銀溶解終以硝酸銀化生焉第二款黃金所在是能以遊離存在地中及河海雖然多是含礦質中銀製法坊間所販黃金者必不純精若不混銀則必混銅焉又欲制其純金則宜投礦塊於硝酸然則其混合物中在礦塊銀等而悉雖可溶解獨黃金決無侵之而殘留於其溶液中性狀黃色光輝其質柔軟槌可為箔片又牽延則為細微線其比重一九三二也若白熾熱遇千百度則熔化為淡緑色液又取箔片透見之則能呈緑色於氣中或於酸素中以烈火煅之亦敢不酸化又冒濕氣不生鏽鹽酸硫酸或煮硝酸亦敢無侵唯以王水則溶解於化格魯兒化金又黃金之鹽溶液為諸般還元劑蓋遇緑礬亞格魯兒化錫蓚酸及諸金屬則為褐色粉末沉澱矣然而其金且其化合物亦皆是受高溫則分解以還元生金矣第四章針之區別及名稱夫制針者別頭鋒腳柄於四部針頭者則尖端而紡錐形針鋒者其體圓且長細但具上下二端上端顆粒狀下端存竇又常針其長概用我二寸強又針腳者突入於柄之下端其竇中且柄質與密著其柄亦向金屬製而其大雖五倍十倍針鋒其長僅不過二仙又針頭者穿皮霄使組織刺入之部而針鋒與針柄者則是依術者被使役之部也第五章針洗潔法片山氏曰古來針家曰雖謂無起化膿於刺針部誠是攝生上不注意之至也宜擬一定之防腐而不可有無其法焉然矣譬猶有施刺針於傳播性之患者直行以其針於他之患者則恰是不異傳播性之病毒因彼接種法試之是以一回所用患者之針者悉投於盛五十倍之石炭酸水平鉢之陶器宜洗滌針鋒及針尖洗滌後拭之可用花綿布而全至無針鋒之微濕後更以柔軟制鹿皮叮嚀反復拭淨其針鋒而可藏針函第六章針貯藏法凡所貯藏制針之函雖由各自之嗜好者恐莫優鱉甲制者是由手神原氏等之經驗亦然矣漆工制木製次之蓋針函則先函底內面更鋪平磨銅板且堆積版面以棉花又包絡綿花以赤色絹或緋縮緬悉覆之而日常欲安置針則斜針鋒或為地平線但其針頭聊令穿絹面徐徐進針鋒於綿花之堆積中漸至以柄之下端而止矣第七章針頭硎磨法凡針頭尖鋭甚則當臨穿表皮患者有感惡痛然若紡錐形則其針頭進入組織之中亦患者不訴惡痛者也是以甲硎法有損治術乙磨法知有益雖然是大有關係術者之巧拙者也諺曰莫邪之劍因持手有味哉又欲知硎磨之精練者則先用面積緻密白色楮紙可以試之其式左手取紙右手持針徐徐刺衡紙面亦敢莫聞幽音況且其紙面快以貫通為可者也反而如呈微音者惟其針之硎磨不至精良第八章制針番數之理由凡制針者自一番至七番而尋常所用之針者三番乃至四番是也將五番以上之針者多是用最急性之患者也假令如施卒倒或眩暈症之類而自一番至二番則用彼小兒或老叟等之體質軟弱者蓋一番之針鋒比較其直徑於蚊嘴自二番以上以順令針鋒之實質為增積之殆至七番則擬似蜂劍是以三番四番位於其中間者也第九章記號配點假所以配置記號於手部各處者無他當行針術大欲使術者得便利者也則名左手拇指腹為點名同食指腹為點名同中指腹為點名同副指腹為點名同小指腹為點名同掌心為點名同手掌外側緣為點又名右手拇指腹為點名同食指腹為點名同中指腹為點名同副指腹為點名同小指腹為點名同掌心為點名同掌外側緣為點第十章刺針一般既診斷了後患者衣服厚則適宜取除之沉意正形而開針函容所出之針柄上端於杉山氏管之下口此際管之上口斜於下方下口向於上方更反轉管之下口使針局密接且其接端者以暫時押之且顯其管之上端打針柄以捷手二三回此際極力則患者訴痛不用力亦不能使針頭穿皮膚況且各人之皮膚堅軟異之宜注意矣蓋針頭全知穿皮膚則以摘管之上端徐徐拔去其管此時以近針頭插鋒則此是二點所謂為押手又以為副手夫押手者常可翦置下端又當進入針鋒皮膚宜酌量患者之強弱與感應若察患者之愈快則可知應針頭分子之波動虛反之而患者訴疼痛則可知分子之波動實內經曰刺虛者段其實解云刺實須其虛者為針陰氣隆至針下寒乃去針也刺虛須其實者為針陽氣隆至針下熱乃去針也注曰要以氣至而有效也總而主針之掌面者左右相共空洞之形假令如擁雞卵抑亦欲下氣則針鋒副點而捻欲上氣則針鋒副點而捻或以順有行或由逆有施難經曰氣滑則針出疾氣澀則針出遲氣隆則針小而入淺氣澀則針大而入深深則欲留淺則欲疾中略以刺針者永留則神經之感應亦反有不屢無效已令患者疲勞故淺深遲疾響波稽留臨機行之蓋施術之後三十分乃至五十分時間可命安臥患者第十一章正式及變式凡刺針之法者宜由正式及變式治療之術者宜斟酌患者之急慢與肥瘠內經曰上工守神神乎神客有門未睹其疾惡知其源刺之微在遲速櫟因曰刺針部宗氣聚來則將欲逐邪氣所謂經氣至是也誠然矣其氣未至引針則不能逐邪氣故無益治愈反之而其氣雖至不去針則似塞邪氣之出路又是無利治術是以氣之至速則刺針進退亦速之氣之至遲則其法遲之第一款正式取刺針之方向於鉛直線溶溶然進針頭終始相共不失其規而徐徐行是謂正式多是用正式者也又正式有二種其一曰操柄針圖略其二曰揉下針則第十八圖是也第二款變式凡取刺針之方向於鋭角終始間斷臨機或稽留凡揮發或潑潑乎為針頭之動者稱變式曰斜行針第二十圖是也又將欲行針法於貴要之部則宜用此式但變式之針法者取地平線之方向而進入其針局況亙組織間道程雖長亦針頭至淺故無與害患者而舉例則流行性感冒謂施本式於顱頂骨與顳顬骨之間其縫際部之類第十二章補法及瀉法內經曰補虛者必先捫而循之切而散之推而按之彈而怒之抓而下之通而取之外引其門以閉其神呼盡納針靜而久留以氣至為故候吸引針氣不得出各在其處推闔其門命神氣存大氣留止命曰補虛瀉實者吸則納針無令氣忤靜以久留無令邪布吸則轉針針以得氣為故候呼引針呼盡乃去大氣皆出故命曰瀉又曰補者隨經脈推而納之左手閉針孔徐出針而疾按之瀉者迎經脈動而伸之左手閉針孔疾出針而徐按之隨而濟之是謂補迎而奪之是謂瀉又一説云補者刺針於呼息拔吸息而揉其針痕瀉者刺針於吸息拔呼息而不揉其針痕也第十三章被黏著牽引拔針法被刺針之牽引有不拔是必竟受筋肉分子之凝聚力故也理學的曰凝聚力者隨異物體中分子之位置自為強弱之區別蓋凝聚力之強弱隨熱度之增減而生矣即倒比溫度又凝聚力者獨不固體耳亦存液體雖然有液體則自己之重力卻而勝凝聚力是以使分子容易動搖故如彼唯不較著己則患者之元氣亦欲為相逼迫也故術者此際使彼我之意靜穩更當其下傍刺他針然而可拔初針或輕打不拔針柄之上端以俟其進入而後拔去針亦是可也第十四章不可施針症一曰格列羅二曰赤痢三曰腸窒扶斯四曰發疹窒扶斯五曰痘瘡六曰實扶的里亞以上六病者猛劇之傳染病也故衛生上大加警戒是以所慎針家也依而省之七曰丹毒八曰酒客九曰勞動過多十曰憤怒者十一曰飽滿十二曰飢餓十三曰熱度高者十四曰流汗十五曰煩渴十六曰衰耗十七曰怖驚十八曰下車後十九曰乘船後第十五章折針拔取法凡刺針在筋肉組織間而動則有折其鋒是有術者由失策或有針質由不煅練然則靜肅沉意必不可放押手尚以捷手可壓縮其皮膚必可得發顯折針之鋒端但此際不可使患者動搖至若患者動搖則彼折針曲行於筋肉中復難發顯者也因曰患者突然發咳之際有如斯者也第十六章刺針禁局凡針局之可禁部大別為頭首及顏面胸腹脊柱四肢之七款第一款頭首對前頭縫合漢名神庭對前頭百會同囟會對耳上筋起始同角孫對後頭動脈孔同顱息對徑靜脈孔同玉枕對顱頂孔同絡郤對後頭百會同腦戶第二款顏面對顴骨顳顬管漢名客主人對下眼窠孔同承泣第三款胸部對腋下動脈經路同雲門對胸骨劍身之中央同膻中對胸骨劍尖之下方同鳩尾第四款腹部對臍部上一應漢名水分對臍中窩同神關對臍下二應同石門對示丨氏韌帶同橫骨對會陰同同第五款脊柱對胸椎第五椎下或外側同神道對胸椎第六椎下同靈臺第六款上肢對肩胛內緣與鎖骨中央之內陷漢名缺盆對三角筋頭靜脈開口部漢名肩井對上膊骨內上髁上方凡三應漢名五里穴對上膊骨外上髁上方凡一應同青靈對內橈骨筋腱之補側同三陽對短外轉拇筋起始部同合谷第七款對股動脈之通路同箕門對比目魚筋同承筋對脛骨之內踝同三陰交第十七章筋肉揉按凡筋肉者雖有隨意不隨意之二種自有所其主宰而各使骨格圍擁且其筋肉者由神經之刺劇而或起感覺或催收縮又如筋肉之肥瘠者則所分布其筋肉之血管關係得其營養與否又揉按將使其筋肉之收縮或痙攣等復常形故揉按者先刺針而有施之又刺針後有行之然而欲行揉按者則先術者之手掌面宜拭清而後可接患者況手術中使患者之體格不可動搖又揉按者以手掌及指腹叮嚀反復雖不如行之或用肘角或手背或握手如與響音者則有外飾亦卻而為之非有效驗第十八章螺旋管之用法刺針之際寒威凜冽則假令有雖厚患者之衣服難除去之不凜冽亦依患者之弊而有絡厚衣然則可用螺旋管蓋螺旋管者如杉山氏管圓甬管之實質中謂設螺旋狀之裝置管且其用法先以探察衣服之厚度豫定其方寸假今其服之厚假定二仙則延長螺旋部亦為同等二仙又假定一仙亦然矣蓋螺旋管者伸縮適宜足得為術者之隨意者也又其管質者以銀製為善良又其形有八角或有圓甬形但有管口之兩緣若不圓滑者則當治術之際令患者之皮膚剔剝是以管口之緣端為善圓滑而惡粗糙且有鋭角者第十九章針頭電氣力與導法穿進針頭於皮膚之組織則必先至所充各組織使分子更發生波動又依其分子波動而分布其所神經亦聿起感覺者也蓋波動發興亦大須寒心注意焉凡針療有初試者有數回者有亙數月者有一周年且至數歲者譬有初試者則概先其感極而敏且有呈不快反之而受針療之日亙長久能在知針效者則假令雖鈍術敢如不介意者故診斷之際憶察為其初試者則施之制針亦可用二番等且勿可與響又亙針療長久者施之則番數稍升大亦刺針時間且可與響苟刺針時間無制度只一局耳久時行之則奏效變有釀害理學的有言曰取活蛙直剝棄下肢表皮且從腰部橫斷之當其縫匠筋以釘消極及積極屬尖頭令抵觸則大腿下腳相共能呈伸縮猶行之數回且至長時間則其筋麻痹終為強直嗚呼萬法至其度則呈妙效過其度則卻而作害唯是以中庸為至德又欲導電氣力於左方則用力於之爪端外方反之欲施電氣力於右方則加力於之爪端側方此際患者若發乾咳則全身為之受其震動故動則有針折鋒術者不可有不注意焉
